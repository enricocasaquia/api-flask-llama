services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
      - ./src/conf:/conf:ro
    ports:
      - "11434:11434"

  api:
    build: .
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - sqlite_data:/app/src/instance
      - ./src:/app/src
    ports:
      - "5000:5000"
    depends_on:
      - ollama

volumes:
  ollama_models:
  sqlite_data: